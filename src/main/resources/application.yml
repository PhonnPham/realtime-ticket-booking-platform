server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: realtime-ticket-booking-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticket_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000ms

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 10
        acknowledge-mode: auto

# Redisson Single Server Configuration
redisson:
  single-server:
    address: "redis://${SPRING_REDIS_HOST:localhost}:${SPRING_REDIS_PORT:6379}"
    password: ${SPRING_REDIS_PASSWORD:null}
    connection-minimum-idle-size: 5
    connection-pool-size: 32
    timeout: 3000

# Custom Application Config
app:
  jwt:
    secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  booking:
    hold-ttl-seconds: 600 # 10 minutes temporary seat hold
    lock-wait-seconds: 3 # Redisson tryLock wait time
    lock-lease-seconds: 10 # Redisson lock lease duration
  rabbitmq:
    exchange: ticket.booking.exchange
    queue: ticket.booking.queue
    routing-key: ticket.booking.routingKey
    dlq-exchange: ticket.dlq.exchange
    dlq-queue: ticket.dlq.queue

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.phonpham.ticketbooking: INFO
    org.springframework.amqp: WARN
